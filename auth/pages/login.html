<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SGCR</title>
    <link rel="icon" type="image/x-icon" href="../assets/midia/icon/favicon.ico">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Content:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <form id="form-login" action="#" method="POST">
            <h1>Login</h1>
            <label for="email">E-mail ou Nome de Usuário:</label>
            <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
            
            <label for="password">Senha:</label>
                <!-- required fará o preenchimento obrigatório para a senha -->
            <input type="password" id="password" name="password" required placeholder="Digite sua senha">
            
            <button type="submit" class="btn-submit">Entrar</button>
    </form>
</body>
</html>
