<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SGCR</title>
    <link rel="icon" type="image/x-icon" href="../assets/midia/icon/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Content:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <form id="form-login" action="../../admin/pages/dashboard.html" method="GET">
        <h1>Login</h1>
        
        <div class="mb-3">
            <label for="email" class="form-label">E-mail ou Nome de Usuário:</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="Digite seu e-mail">
        </div>
        
        <div class="mb-4">
            <label for="password" class="form-label">Senha:</label>
            <!-- required fará o preenchimento obrigatório para a senha -->
            <input type="password" class="form-control" id="password" name="password" required placeholder="Digite sua senha">
        </div>
        
        <button type="submit" class="btn btn-submit w-100">Entrar</button>
        
        <div class="text-center mt-3">
            <a href="../../infrastructure/pages/index.html" class="voltar-link">Voltar para a Página Inicial</a>
        </div>
    </form>
</body>
</html>
